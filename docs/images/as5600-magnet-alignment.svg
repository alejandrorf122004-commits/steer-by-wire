<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #17324d; }
      .label { font: 600 19px 'Segoe UI', sans-serif; fill: #17324d; }
      .note { font: 500 17px 'Segoe UI', sans-serif; fill: #4b6175; }
      .tiny { font: 600 15px 'Segoe UI', sans-serif; fill: #4b6175; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b2238" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c7772b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#f4f0e8"/>
  <text x="50" y="54" class="title">Montaje correcto del iman diametral</text>

  <!-- Top view -->
  <g transform="translate(80 100)">
    <text x="150" y="0" class="label">Vista superior</text>
    <rect x="30" y="50" width="430" height="360" rx="28" fill="#2f7d77" filter="url(#shadow)"/>
    <rect x="145" y="140" width="200" height="180" rx="16" fill="#263642"/>
    <circle cx="245" cy="230" r="92" fill="#ffffff" stroke="#17324d" stroke-width="5"/>
    <path d="M153 230 A92 92 0 0 1 337 230 L245 230 Z" fill="#d94841"/>
    <path d="M337 230 A92 92 0 0 1 153 230 L245 230 Z" fill="#4d6fa9"/>
    <line x1="245" y1="105" x2="245" y2="355" stroke="#e7b44b" stroke-width="4" stroke-dasharray="10 9"/>
    <line x1="120" y1="230" x2="370" y2="230" stroke="#e7b44b" stroke-width="4" stroke-dasharray="10 9"/>
    <circle cx="245" cy="230" r="7" fill="#e7b44b"/>
    <text x="184" y="191" class="label" fill="#ffffff">N</text>
    <text x="292" y="282" class="label" fill="#ffffff">S</text>
    <text x="78" y="445" class="note">Centro del iman alineado con el centro del chip</text>
  </g>

  <!-- Side view -->
  <g transform="translate(655 100)">
    <text x="150" y="0" class="label">Vista lateral</text>
    <rect x="40" y="335" width="430" height="38" rx="8" fill="#2f7d77" filter="url(#shadow)"/>
    <rect x="190" y="290" width="130" height="45" rx="7" fill="#263642"/>
    <rect x="170" y="95" width="170" height="70" rx="12" fill="#d94841" stroke="#17324d" stroke-width="4"/>
    <rect x="255" y="95" width="85" height="70" rx="0" fill="#4d6fa9"/>
    <line x1="255" y1="75" x2="255" y2="390" stroke="#e7b44b" stroke-width="4" stroke-dasharray="10 9"/>
    <line x1="365" y1="170" x2="365" y2="285" stroke="#c7772b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="365" y1="285" x2="365" y2="170" stroke="#c7772b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="385" y="225" class="label">0.5 a 3 mm</text>
    <text x="205" y="135" class="label" fill="#ffffff">N</text>
    <text x="290" y="135" class="label" fill="#ffffff">S</text>
    <text x="118" y="430" class="note">La cara del iman queda paralela a la placa</text>
    <text x="95" y="462" class="tiny">El iman no debe tocar el encapsulado ni poder soltarse</text>
  </g>

  <rect x="60" y="545" width="1080" height="48" rx="14" fill="#fff7e5" stroke="#d89b28" stroke-width="2"/>
  <text x="84" y="576" class="note">Un iman axial o descentrado puede producir lecturas incorrectas aunque el cableado sea perfecto.</text>
</svg>
